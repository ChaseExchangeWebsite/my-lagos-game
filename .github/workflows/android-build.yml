name: Build MY LAGOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate project ZIP
        run: |
          find . -maxdepth 3 -type f -name '*.zip'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip MY_LAGOS_ANDROID_PROJECT_v0.5.zip -d android-project
          find android-project -maxdepth 4 -type f | head -80

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-LAGOS-Android-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
