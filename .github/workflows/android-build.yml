name: Build MY LAGOS APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      unzip MY_LAGOS_ANDROID_PROJECT_v0.5.zip -d android-project
      ls -la android-project

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build debug APK
    working-directory: android-project
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MY-LAGOS-Android-APK
      path: android-project/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
