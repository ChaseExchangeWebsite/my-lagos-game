name: Build MY LAGOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract v0.6 Android project
        run: | set -e test -f MY_LAGOS_ANDROID_PROJECT_v0.6.zip mkdir -p android-project unzip -o MY_LAGOS_ANDROID_PROJECT_v0.6.zip -d android-project PROJECT_DIR="$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)" test -n "$PROJECT_DIR" echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV" echo "Gradle project found at: $PROJECT_DIR" 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MY-LAGOS-v0.6-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
